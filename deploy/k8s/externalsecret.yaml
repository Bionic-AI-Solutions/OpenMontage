# All OpenMontage secrets reach the pod through this ExternalSecret (workspace rule:
# secrets live in Vault and reach Kubernetes only via ESO). No VAULT_TOKEN is synced:
# the app no longer reads Vault at runtime (VAULT_SKIP_LOAD=true in configmap.yaml).
# Shared provider keys come from secret/shared/api-keys; app-only keys from
# secret/t6-apps/openmontage/config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmontage-secrets
  namespace: openmontage
  labels:
    app.kubernetes.io/name: openmontage
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: openmontage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        ANTHROPIC_API_KEY: "{{ .anthropic_api_key }}"
        ELEVENLABS_API_KEY: "{{ .elevenlabs_api_key }}"
        GEMINI_API_KEY: "{{ .gemini_api_key }}"
        GOOGLE_API_KEY: "{{ .gemini_api_key }}"
        GPU_AI_API_KEY: "{{ .mcp_api_key }}"
        HF_TOKEN: "{{ .hf_token }}"
        MCP_API_KEY: "{{ .mcp_api_key }}"
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        OPENROUTER_API_KEY: "{{ .openrouter_api_key }}"
        SARVAM_API_KEY: "{{ .sarvam_api_key }}"
  data:
    - secretKey: openai_api_key
      remoteRef: { key: shared/api-keys, property: openai_api_key }
    - secretKey: elevenlabs_api_key
      remoteRef: { key: shared/api-keys, property: elevenlabs_api_key }
    - secretKey: gemini_api_key
      remoteRef: { key: shared/api-keys, property: gemini_api_key }
    - secretKey: hf_token
      remoteRef: { key: shared/api-keys, property: hf_token }
    - secretKey: anthropic_api_key
      remoteRef: { key: shared/api-keys, property: anthropic_api_key }
    - secretKey: sarvam_api_key
      remoteRef: { key: shared/api-keys, property: SARVAM_API_KEY }
    - secretKey: mcp_api_key
      remoteRef: { key: shared/api-keys, property: mcp_api_key }
    - secretKey: openrouter_api_key
      remoteRef: { key: t6-apps/openmontage/config, property: openrouter_api_key }
